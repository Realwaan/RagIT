services:
  ragit:
    build:
      context: .
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?Set the frontend Clerk publishable key}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      RAGIT_ENV: production
      RAGIT_AUTH_MODE: clerk
    init: true
    stop_grace_period: 130s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 8g
    cpus: 4
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    volumes:
      - ragit_storage:/var/lib/ragit

volumes:
  ragit_storage:

